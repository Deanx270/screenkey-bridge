plugins { id 'com.android.application' }

android {
    namespace 'com.screenkeybridge.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.screenkeybridge.app'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.screenkeybridge.app.ShortcutInstrumentation'
        manifestPlaceholders = [appLabel: 'ScreenKey Bridge', keyboardLabel: 'ScreenKey Bridge Keyboard', tileLabel: 'Capture PC screen']
    }
    def releaseStore = System.getenv('SCREENKEY_KEYSTORE')
    def releasePassword = System.getenv('SCREENKEY_SIGN_PASSWORD')
    if (releaseStore != null && releasePassword != null) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias 'screenkeybridge'
                keyPassword releasePassword
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
    buildTypes {
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            matchingFallbacks = ['release']
            manifestPlaceholders = [appLabel: 'ScreenKey Bridge Preview', keyboardLabel: 'ScreenKey Bridge Preview Keyboard', tileLabel: 'Capture PC (Preview)']
        }
    }
}
