name: Build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build windows/ScreenKeyBridge/ScreenKeyBridge.csproj -c Release
      - run: dotnet run --project windows/ScreenKeyBridge.Tests/ScreenKeyBridge.Tests.csproj -c Release -- windows/ScreenKeyBridge/bin/Release/net8.0-windows/ScreenKeyBridge.dll
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android assembleDebug assembleDebugAndroidTest
